
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up workspace before running the pipeline
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.18
      script: |
        #!/bin/sh
        rm -rf "$(workspaces.source.path)"/*

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Run unit tests using Nose
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        pip install -r requirements.txt
        pip install nose
        nosetests -v --with-spec --spec-color --with-coverage --cover-package=app
